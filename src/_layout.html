<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{SITE_URL}}/{{FILE_URL}}">
<link rel="canonical" href="{{SITE_URL}}/{{FILE_URL}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="./" aria-label="허브 홈">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#13304f"/><circle cx="32" cy="32" r="7" fill="#f2a33a"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="20 7"/></svg>
      허브
    </a>
    <nav class="nav" aria-label="서비스">
{{NAV}}
    </nav>
    <a class="btn small call" href="tel:{{TEL_LINK}}">전화 상담</a>
  </div>
</header>

<main>
{{BODY}}
  <section class="contact" id="contact">
    <div class="wrap">
      <div>
        <h2>{{CONTACT_TITLE}}</h2>
        <p>전화 주시면 사무실 상황에 맞춰 바로 안내해 드립니다.</p>
        <a class="tel" href="tel:{{TEL_LINK}}">{{TEL}}</a>
        <div class="actions">
          <a class="btn" href="tel:{{TEL_LINK}}">전화 걸기</a>
          <a class="btn ghost" href="{{KAKAO}}">카카오톡 문의</a>
        </div>
      </div>
      <dl>
        <dt>상담 시간</dt><dd>평일 09:00 – 18:00</dd>
        <dt>이메일</dt><dd><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></dd>
        <dt>주소</dt><dd>{{ADDRESS}}</dd>
        <dt>방문 지역</dt><dd>의정부를 중심으로 경기북부</dd>
      </dl>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>{{COMPANY}}</span><span>대표 {{CEO}}</span><span>사업자등록번호 {{BIZNO}}</span>
    <span>LG U+ 공식 대리점</span>
  </div>
</footer>
</body>
</html>
